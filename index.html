<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Viva Prep — National University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#1e2430;
  --ink-soft:#5c6472;
  --line:#e2e6ec;
  --primary:#2e5aa8;
  --primary-dark:#1f3f7a;
  --primary-soft:#e8effa;
  --accent:#1e8f6a;
  --accent-soft:#e6f5ef;
  --done:#1e8f6a;
  --shadow:0 1px 3px rgba(20,30,50,0.08);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Hind Siliguri', sans-serif;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-bottom:40px;
}
.wrap{ max-width:760px; margin:0 auto; padding:0 12px; }

header{
  background:linear-gradient(135deg, var(--primary-dark), var(--primary));
  color:#fff;
  padding:22px 14px 18px;
  text-align:center;
}
header h1{ margin:0 0 4px; font-size:21px; font-weight:700; }
header p{ margin:0; font-size:13px; opacity:0.9; }

.stickybar{
  background:var(--bg);
  padding:12px 0 8px;
}

.progresswrap{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  margin:12px 0;
  box-shadow:var(--shadow);
}
.progresswrap .toprow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-bottom:6px;
}
.progresswrap .toprow b{ color:var(--primary); font-family:'JetBrains Mono', monospace; }
.progressbar{
  height:8px;
  background:var(--line);
  border-radius:6px;
  overflow:hidden;
}
.progressbar .fill{
  height:100%;
  background:linear-gradient(90deg, var(--accent), #27b58a);
  width:0%;
  transition:width 0.3s ease;
}
.resetbtn{
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:11.5px;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
  font-family:'Hind Siliguri', sans-serif;
}

.searchbox{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-size:14.5px;
  font-family:'Hind Siliguri', sans-serif;
  background:var(--card);
  margin-bottom:10px;
}
.searchbox:focus{ outline:none; border-color:var(--primary); }

.filterrow{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding-bottom:4px;
}
.chip{
  flex:0 0 auto;
  background:var(--card);
  border:1.5px solid var(--line);
  color:var(--ink-soft);
  padding:6px 13px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.15s ease;
}
.chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

#count-info{
  font-size:12px;
  color:var(--ink-soft);
  margin:6px 2px 2px;
}

.qlist{ margin-top:8px; }

.qcard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:8px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.qcard.done{ border-left:4px solid var(--done); }

.qhead{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 14px;
  cursor:pointer;
  user-select:none;
}
.qnum{
  flex:0 0 auto;
  background:var(--primary-soft);
  color:var(--primary-dark);
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  font-weight:700;
  border-radius:6px;
  padding:3px 7px;
  min-width:28px;
  text-align:center;
}
.qcard.done .qnum{ background:var(--accent-soft); color:var(--accent); }
.qtext{
  flex:1;
  font-size:14.5px;
  font-weight:600;
  color:var(--ink);
}
.qarrow{
  flex:0 0 auto;
  color:var(--ink-soft);
  font-size:12px;
  transition:transform 0.2s ease;
  margin-top:3px;
}
.qcard.open .qarrow{ transform:rotate(90deg); }

.qbody{
  display:none;
  padding:0 14px 14px 50px;
  font-size:14px;
  color:var(--ink-soft);
  border-top:1px dashed var(--line);
}
.qcard.open .qbody{ display:block; padding-top:10px; }

.checkrow{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.checkrow input{ width:15px; height:15px; accent-color: var(--accent); cursor:pointer; }
.checkrow label{ cursor:pointer; }

.catlabel{
  font-family:'Hind Siliguri', sans-serif;
  font-size:12px;
  letter-spacing:0.3px;
  color:var(--primary);
  font-weight:700;
  margin:18px 2px 6px;
}

.empty{
  text-align:center;
  color:var(--ink-soft);
  padding:30px 10px;
  font-size:14px;
}
</style>
</head>
<body>

<header>
  <h1>ICT Viva Prep</h1>
  <p>তথ্য ও যোগাযোগ প্রযুক্তি — মৌখিক পরীক্ষার প্রস্তুতি</p>
</header>

<div class="wrap">
  <div class="stickybar">
    <div class="progresswrap">
      <div class="toprow">
        <span>অগ্রগতি: <b id="progress-text">0/0</b></span>
        <button class="resetbtn" onclick="resetProgress()">রিসেট করুন</button>
      </div>
      <div class="progressbar"><div class="fill" id="progress-fill"></div></div>
    </div>
    <input type="text" id="search" class="searchbox" placeholder="প্রশ্ন খুঁজুন..." oninput="renderList()">
    <div class="filterrow" id="filter-row"></div>
    <div id="count-info"></div>
  </div>

  <div class="qlist" id="qlist"></div>
</div>

<script>
// প্রতিটি অধ্যায়: { cat, items: [ [নম্বর, প্রশ্ন, উত্তর], ... ] }
const chapters = [
{ cat:"১ম অধ্যায়: ICT ও কম্পিউটার সিস্টেমের পরিচয়", items:[
 [1,"ICT বলতে কী বুঝ? [What is meant by ICT?]","ICT হলো তথ্য ও যোগাযোগ প্রযুক্তি, যা কম্পিউটার এবং টেলিযোগাযোগ ব্যবস্থা ব্যবহার করে তথ্য প্রক্রিয়াকরণ, সংরক্ষণ ও আদানপ্রদানের সুবিধা দেয়।"],
 [2,"ICT এর পূর্ণরূপ কী? [What is the full form of ICT?]","ICT এর পূর্ণরূপ Information and Communication Technology."],
 [3,"ই-মেইল কী? [What is e-mail?]","ই-মেইল হলো ইন্টারনেট ব্যবহার করে বার্তা বা তথ্য পাঠানোর একটি মাধ্যম।"],
 [4,"ইন্টারনেট কী? [What is the Internet?]","ইন্টারনেট হলো বিশ্বব্যাপী সংযুক্ত কম্পিউটার নেটওয়ার্কের সমষ্টি, যা তথ্য আদানপ্রদানের সুযোগ দেয়।"],
 [5,"ডেটা কী? [What is data?]","ডেটা হলো অপরিশোধিত বা কাঁচা তথ্য, যা পরবর্তীতে প্রক্রিয়াজাত হয়ে তথ্য বা জ্ঞানে রূপান্তরিত হয়।"],
 [6,"সিস্টেম ইউনিট কী? [What is system unit?]","সিস্টেম ইউনিট হলো কম্পিউটারের মূল অংশ যেখানে তথ্য প্রক্রিয়াকরণ, মেমরি ও প্রসেসর থাকে।"],
 [7,"সিস্টেম ইউনিটের অংশ কয়টি? [How many parts are there in a system unit?]","সিস্টেম ইউনিটের অংশ তিনটি। যথা: ইনপুট ইউনিট, প্রসেসিং ইউনিট ও আউটপুট ইউনিট।"],
 [8,"RAM কী? [What is RAM?]","RAM হলো অস্থায়ী মেমরি, যা কম্পিউটার চলাকালে ডেটা ও প্রোগ্রাম সংরক্ষণে ব্যবহৃত হয়।"],
 [9,"ROM কী? [What is ROM?]","ROM হলো স্থায়ী মেমোরি, যা কম্পিউটার চালু হওয়া থেকে প্রয়োজনীয় নির্দেশনা সরবরাহ করে।"],
 [10,"প্রসেসর কী? [What is a processor?]","প্রসেসর হলো এমন একটি চিপ, যা কম্পিউটারের সকল নির্দেশনা বিশ্লেষণ ও তথ্য প্রাক্রিয়াকরণ করে।"],
 [11,"কম্পিউটার সিস্টেম কী? [What is computer system?]","কম্পিউটার সিস্টেম হলো হার্ডওয়্যার, সফটওয়্যার এবং ইউজারের সমন্বিত রূপ, যা তথ্য প্রক্রিয়াকরণ করে।"],
 [12,"সফটওয়্যার কত প্রকার ও কী কী? [What are the two types of software?]","সফটওয়্যার দুই প্রকার। যথা: ১. সিস্টেম সফটওয়্যার ও ২. অ্যাপ্লিকেশন সফটওয়্যার।"],
 [13,"সিস্টেম সফটওয়্যার কী? [What is system software?]","সিস্টেম সফটওয়্যার হলো এমন সফটওয়্যার, যা কম্পিউটারের হার্ডওয়্যারকে নিয়ন্ত্রণ ও পরিচালনা করে।"],
 [14,"অ্যাপ্লিকেশন সফটওয়্যার কী? [What is application software?]","অ্যাপ্লিকেশন সফটওয়্যার হলো ব্যবহারকারীর নির্দিষ্ট কাজ সম্পাদনের জন্য তৈরি প্রোগ্রাম।"],
 [15,"কম্পিউটার প্রোগ্রাম কী? [What is computer program?]","কম্পিউটার প্রোগ্রাম হলো কম্পিউটারের ভাষায় লেখা নির্দেশনার সমষ্টি, যা কোনো কাজ সম্পাদন করে।"],
 [16,"অপারেটিং সিস্টেম কী? [What is an operating system?]","অপারেটিং সিস্টেম হলো সিস্টেম সফটওয়্যার, যা কম্পিউটারের হার্ডওয়্যার ও সফটওয়্যার ব্যবস্থাকে নিয়ন্ত্রণ করে।"],
 [17,"GUI কী? [What is GUI?]","GUI বা Graphical User Interface হলো এমন ব্যবহারকারী ইন্টারফেস, যা চিত্র ও আইকন ব্যবহার করে কমান্ড সম্পাদন করে।"],
 [18,"কম্পিউটার নেটওয়ার্ক কী? [What is a computer network?]","কম্পিউটার নেটওয়ার্ক হলো একাধিক কম্পিউটার ও ডিভাইস সংযুক্ত একটি সিস্টেম, যা তথ্য আদানপ্রদানের সুযোগ দেয়।"],
 [19,"মডেম কী? [What is a modem?]","মডেম হলো এমন একটি ডিভাইস যা ডিজিটাল ডেটাকে অ্যানালগ সিগন্যালে এবং অ্যানালগ সিগন্যালকে ডিজিটাল ডেটায় রূপান্তর করে।"],
 [20,"LAN কী? [What is LAN?]","LAN বা Local Area Network হলো সীমিত অঞ্চলে সংযুক্ত কম্পিউটারের নেটওয়ার্ক।"],
 [21,"WAN কী? [What is WAN?]","WAN বা Wide Area Network হলো বিস্তৃত অঞ্চলে সংযুক্ত কম্পিউটারের নেটওয়ার্ক।"],
 [22,"হাইব্রিড কম্পিউটার কী? [What is Hybrid Computer?]","অ্যানালগ কম্পিউটার এবং ডিজিটাল কম্পিউটার এ দুই শ্রেণির কম্পিউটার প্রযুক্তির সমন্বয়ে তৈরি কম্পিউটারকে হাইব্রিড কম্পিউটার বলে।"],
 [23,"সুপার কম্পিউটার কী? [What is a supercomputer?]","সুপার কম্পিউটার হলো অত্যন্ত দ্রুত কম্পিউটার, যা জটিল গণনা ও বিজ্ঞান গবেষণায় ব্যবহৃত হয়।"],
 [24,"আইপি ঠিকানা কী? [What is an IP address?]","আইপি ঠিকানা হলো নেটওয়ার্কের প্রতিটি কম্পিউটার বা ডিভাইসকে শনাক্ত করার জন্য নির্দিষ্ট সংখ্যা।"],
 [25,"URL কী? [What is a URL?]","URL বা Uniform Resource Locator হলো ওয়েবসাইটের ঠিকানা, যা ইন্টারনেটে পেজ খুঁজতে সাহায্য করে।"],
 [26,"সার্চ ইঞ্জিন কী? [What is a search engine?]","সার্চ ইঞ্জিন হলো ইন্টারনেটে তথ্য খুঁজে বের করার সফটওয়্যার।"],
 [27,"ডেটাবেস কী? [What is a database?]","ডেটাবেস হলো সুশৃঙ্খলভাবে সংরক্ষিত তথ্যের সমষ্টি, যা প্রয়োজন অনুযায়ী অ্যাক্সেস করা যায়।"],
 [28,"IoT কী বোঝায়? [What is IoT?]","IoT বা Internet of Things হলো এমন প্রযুক্তি যেখানে দৈনন্দিন ডিভাইস ইন্টারনেটের মাধ্যমে সংযুক্ত থাকে।"],
 [29,"ওয়েব সার্ভার কী? [What is a web server?]","ওয়েব সার্ভার হলো এমন কম্পিউটার, যা ব্যবহারকারীর অনুরোধে ওয়েবপেজ সংরক্ষণ ও প্রদর্শন করে।"],
 [30,"ই-কমার্স কী? [What is e-commerce?]","ই-কমার্স হলো ইন্টারনেট ব্যবহার করে পণ্য ও সেবা ক্রয়-বিক্রয় করার পদ্ধতি।"]
]},
{ cat:"২য় অধ্যায়: কম্পিউটার হার্ডওয়্যার ও সফটওয়্যার", items:[
 [31,"হার্ডওয়্যার কী? [What is hardware?]","হার্ডওয়্যার হলো কম্পিউটারের দৃশ্যমান ও স্পর্শযোগ্য অংশসমূহ।"],
 [32,"সফটওয়্যার কী? [What is software?]","সফটওয়্যার হলো কম্পিউটারে নির্দিষ্ট কাজ সম্পাদনের উদ্দেশ্যে লিখিত নির্দেশনার সমষ্টি।"],
 [33,"ইনপুট কী? [What is input?]","ইনপুট হলো ব্যবহারকারী প্রদত্ত ডেটা বা নির্দেশনা, যা কম্পিউটারে প্রবেশ করানো হয়।"],

const data = [];
chapters.forEach(ch => ch.items.forEach(it => data.push({id:it[0], cat:ch.cat, q:it[1], a:it[2]})));

const STORAGE_KEY = "ict_viva_progress_v2";
let activeCat = "সব";
let openId = null;

function getProgress(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function setProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
function toggleDone(id, checked){
  const p = getProgress();
  if(checked){ p[id] = true; } else { delete p[id]; }
  setProgress(p);
  updateProgressBar();
  renderList();
}
function resetProgress(){
  if(confirm("সব অগ্রগতি মুছে ফেলতে চান?")){
    setProgress({});
    updateProgressBar();
    renderList();
  }
}
function updateProgressBar(){
  const p = getProgress();
  const done = Object.keys(p).length;
  const total = data.length;
  document.getElementById("progress-text").textContent = done + "/" + total;
  document.getElementById("progress-fill").style.width = (total? (done/total*100) : 0) + "%";
}

function buildFilters(){
  const cats = ["সব", ...new Set(data.map(d=>d.cat))];
  const row = document.getElementById("filter-row");
  row.innerHTML = "";
  cats.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (c===activeCat ? " active":"");
    chip.textContent = c;
    chip.onclick = ()=>{ activeCat = c; buildFilters(); renderList(); };
    row.appendChild(chip);
  });
}

function renderList(){
  const term = document.getElementById("search").value.trim().toLowerCase();
  const p = getProgress();
  const list = document.getElementById("qlist");
  list.innerHTML = "";

  const filtered = data.filter(d=>{
    const matchCat = activeCat==="সব" || d.cat===activeCat;
    const matchTerm = !term || d.q.toLowerCase().includes(term) || d.a.toLowerCase().includes(term);
    return matchCat && matchTerm;
  });

  document.getElementById("count-info").textContent = filtered.length + " টি প্রশ্ন দেখানো হচ্ছে";

  if(filtered.length===0){
    list.innerHTML = '<div class="empty">কোনো প্রশ্ন পাওয়া যায়নি।</div>';
    return;
  }

  let lastCat = null;
  filtered.forEach(d=>{
    if(activeCat==="সব" && d.cat !== lastCat){
      const label = document.createElement("div");
      label.className = "catlabel";
      label.textContent = d.cat;
      list.appendChild(label);
      lastCat = d.cat;
    }

    const card = document.createElement("div");
    card.className = "qcard" + (p[d.id] ? " done":"") + (openId===d.id ? " open":"");

    const head = document.createElement("div");
    head.className = "qhead";
    head.onclick = ()=>{ openId = (openId===d.id ? null : d.id); renderList(); };
    head.innerHTML = `<div class="qnum">${d.id}</div><div class="qtext">${d.q}</div><div class="qarrow">▶</div>`;
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "qbody";
    body.innerHTML = `<div>${d.a}</div>
      <div class="checkrow">
        <input type="checkbox" id="chk-${d.id}" ${p[d.id]?"checked":""}>
        <label for="chk-${d.id}">মুখস্থ হয়েছে</label>
      </div>`;
    card.appendChild(body);

    list.appendChild(card);

    const chk = body.querySelector("input");
    chk.onclick = (e)=>{ e.stopPropagation(); toggleDone(d.id, chk.checked); };
  });
}

buildFilters();
updateProgressBar();
renderList();
</script>
</body>
</html>
